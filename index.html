<body>
<header>
  <h1>My Pastel Note ♡</h1>
  <p class="subtitle">
    ちいさな毎日のメモ帳
  </p>
</header>

<main>
  <input id="title"
    placeholder="メモのタイトル ♡">

  <textarea id="body"
    placeholder="ここにメモを書いてね..."></textarea>

  <button id="save">＋ メモを保存</button>

  <section id="notes"></section>

  <footer>
    あなたの毎日をかわいく記録 ♡
  </footer>
</main>

<script>
const titleInput = document.getElementById("title");
const bodyInput = document.getElementById("body");
const notesArea = document.getElementById("notes");

let notes = JSON.parse(
  localStorage.getItem("pastelNotes") || "[]"
);

let editingId = null;

function saveAll() {
  localStorage.setItem(
    "pastelNotes",
    JSON.stringify(notes)
  );
}

function renderNotes() {
  notesArea.replaceChildren();

  notes.forEach(note => {
    const card = document.createElement("article");
    card.className = "note";

    const title = document.createElement("h3");
    title.textContent = note.title || "タイトルなし ♡";

    const content = document.createElement("p");
    content.textContent = note.body;

    const date = document.createElement("small");
    date.textContent = note.date;

    const edit = document.createElement("button");
    edit.textContent = "編集";

    edit.onclick = () => {
      titleInput.value = note.title;
      bodyInput.value = note.body;
      editingId = note.id;
      document.getElementById("save").textContent =
        "変更を保存";
      titleInput.focus();
    };

    const remove = document.createElement("button");
    remove.textContent = "削除";
    remove.className = "delete";

    remove.onclick = () => {
      if (!confirm("このメモを削除する？")) return;
      notes = notes.filter(n => n.id !== note.id);
      saveAll();
      renderNotes();
    };

    card.append(title, content, date, edit, remove);
    notesArea.append(card);
  });
}

document.getElementById("save").onclick = () => {
  const title = titleInput.value.trim();
  const body = bodyInput.value.trim();

  if (!title && !body) {
    alert("メモを書いてね ♡");
    return;
  }

  if (editingId !== null) {
    notes = notes.map(note =>
      note.id === editingId
        ? { ...note, title, body }
        : note
    );
  } else {
    notes.unshift({
      id: Date.now(),
      title,
      body,
      date: new Date().toLocaleDateString("ja-JP")
    });
  }

  saveAll();

  titleInput.value = "";
  bodyInput.value = "";
  editingId = null;

  document.getElementById("save").textContent =
    "＋ メモを保存";

  renderNotes();
};

renderNotes();
</script>
</body>
